# Smoke-test config used by the workflow. Shaped like the real deployments (recursive, no
# forwarders, chroot, DNSSEC via the auto-updated root key, drop to _unbound), so a release
# that breaks that setup fails in CI instead of on the resolvers.
server:
    directory: "/opt/unbound/etc/unbound"
    chroot: "/opt/unbound/etc/unbound"
    username: "_unbound"
    interface: 0.0.0.0@53
    access-control: 127.0.0.1/32 allow
    auto-trust-anchor-file: "var/root.key"
    do-daemonize: no
    do-ip6: no
    logfile: ""
    use-syslog: no
    verbosity: 1
    log-servfail: yes
    harden-dnssec-stripped: yes
    msg-cache-size: 4m
    rrset-cache-size: 8m
remote-control:
    control-enable: no
