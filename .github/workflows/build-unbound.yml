name: Build unbound image

# Builds Unbound from NLnet Labs' signed source tarball into a multi-arch image
# (linux/amd64 for Sandyman, linux/arm64 for the Pis) and pushes it to GHCR.
#
# Weekly run publishes when EITHER:
#   - NLnet Labs has released a new Unbound version, or
#   - debian:trixie-slim has changed since the published image was built (OpenSSL and the
#     other libraries come from Debian, so this is how their security fixes arrive).
# Otherwise it does nothing. Manual runs can pick a version and force a rebuild.
# Pull requests build and smoke-test both architectures but never push.
#
# Tags: <version> (moves when the base is refreshed), <version>-<YYYYMMDD> (never moves),
# latest.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (the yubihsm-connector build runs at 06:00)
  workflow_dispatch:
    inputs:
      version:
        description: 'Unbound version to build, e.g. 1.26.1 (blank = latest)'
        required: false
        default: ''
      force:
        description: 'Rebuild and push even if nothing changed'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Dockerfile
      - data/**
      - scripts/**
      - test/**
      - .github/workflows/build-unbound.yml
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/unbound
  BASE_IMAGE: debian:trixie-slim
  NLNET_DOWNLOADS: https://nlnetlabs.nl/downloads/unbound

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine target version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Directory listing of every release; the regex skips release candidates
            # (unbound-1.26.0rc1.tar.gz) because .tar.gz must follow the third number.
            VERSION=$(curl -fsSL "${NLNET_DOWNLOADS}/" \
              | grep -oE 'unbound-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed -E 's/unbound-(.*)\.tar\.gz/\1/' \
              | sort -uV | tail -n1)
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not determine a valid Unbound version (got '${VERSION}')"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "date=$(date -u +%Y%m%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Target: Unbound $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # Digest of the multi-arch base index, recorded in each image's labels.
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Base $BASE_IMAGE = $BASE_DIGEST"

          if [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Forced build ($GITHUB_EVENT_NAME)."; exit 0
          fi
          if ! docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "${VERSION} not published yet."; exit 0
          fi
          PUBLISHED_BASE=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json (index .Image "linux/amd64").Config.Labels}}' \
            | jq -r '."org.opencontainers.image.base.digest" // empty')
          if [ "$PUBLISHED_BASE" != "$BASE_DIGEST" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Base image changed (${PUBLISHED_BASE:-none} -> ${BASE_DIGEST}); rebuilding ${VERSION}."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is published on the current base. Nothing to do."
          fi

      - name: Download and verify signed source
        if: steps.check.outputs.build == 'true'
        run: bash scripts/fetch-unbound.sh "${{ steps.version.outputs.version }}" src

      # Build each architecture into the local docker store so it can be tested before
      # anything is pushed. The push step afterwards reuses these layers from the builder cache.
      - name: Build amd64 (test)
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: unbound:test-amd64
          build-args: |
            DEBIAN_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.check.outputs.base_digest }}
            UNBOUND_VERSION=${{ steps.version.outputs.version }}
            BASE_DIGEST=${{ steps.check.outputs.base_digest }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 (test)
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: unbound:test-arm64
          build-args: |
            DEBIAN_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.check.outputs.base_digest }}
            UNBOUND_VERSION=${{ steps.version.outputs.version }}
            BASE_DIGEST=${{ steps.check.outputs.base_digest }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.check.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; docker logs ub 2>&1 | tail -n 50 || true; exit 1; }

          for arch in amd64 arm64; do
            echo "== $arch: version and linked libraries"
            docker run --rm --platform "linux/$arch" "unbound:test-$arch" unbound -V > /tmp/v 2>&1 \
              || { cat /tmp/v; fail "$arch: unbound -V failed"; }
            cat /tmp/v
            grep -q "Version ${VERSION}" /tmp/v || fail "$arch image reports the wrong version"
            echo "== $arch: generated default config is valid"
            docker run --rm --platform "linux/$arch" --entrypoint bash "unbound:test-$arch" \
              -c 'sed -i "s|^exec .*|exec unbound-checkconf /opt/unbound/etc/unbound/unbound.conf|" /unbound.sh && /unbound.sh' \
              || fail "$arch: default config fails unbound-checkconf"
          done

          # Full run on amd64 with a config shaped like the real deployments.
          docker run -d --name ub -v "$PWD/test/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro" unbound:test-amd64 \
            || fail "test container did not start"
          for _ in $(seq 1 30); do
            docker exec ub drill @127.0.0.1 localhost > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec ub drill @127.0.0.1 localhost > /dev/null || fail "not answering on 127.0.0.1:53"

          echo "== recursive lookup with DNSSEC validation (expect the ad flag)"
          docker exec ub drill -D @127.0.0.1 nlnetlabs.nl A > /tmp/ok 2>&1 || true
          cat /tmp/ok
          grep -qE 'flags:.* ad' /tmp/ok || fail "nlnetlabs.nl did not validate"

          echo "== deliberately broken DNSSEC (expect SERVFAIL)"
          docker exec ub drill @127.0.0.1 dnssec-failed.org A > /tmp/bad 2>&1 || true
          cat /tmp/bad
          grep -q 'rcode: SERVFAIL' /tmp/bad || fail "dnssec-failed.org was not rejected - validation is off"

          echo "== process dropped to _unbound"
          # No ps in the image; read /proc instead. stat resolves the name from the container's passwd.
          # The trailing "true" matters: without it the loop's last test (on the sh process itself)
          # is false, sh exits 1, and set -e kills the step with no message (first run, 2026-10-11).
          RUNAS=$(docker exec ub sh -c 'for p in /proc/[0-9]*; do [ "$(cat $p/comm 2>/dev/null)" = unbound ] && stat -c %U $p; done; true') \
            || fail "could not inspect processes in the test container"
          echo "unbound runs as: ${RUNAS}"
          [ "$RUNAS" = "_unbound" ] || fail "unbound is not running as _unbound"

          docker rm -f ub > /dev/null || true
          echo "Smoke test passed."

      - name: Push multi-arch image
        id: push
        if: steps.check.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true           # provenance attestation is on by default in v7
          build-args: |
            DEBIAN_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.check.outputs.base_digest }}
            UNBOUND_VERSION=${{ steps.version.outputs.version }}
            BASE_DIGEST=${{ steps.check.outputs.base_digest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - name: Summary
        if: always()
        run: |
          {
            echo "### Unbound ${{ steps.version.outputs.version }}"
            echo "- Base: \`${BASE_IMAGE}@${{ steps.check.outputs.base_digest }}\`"
            echo "- Built: ${{ steps.check.outputs.build }}"
            if [ "${{ steps.push.outcome }}" = "success" ]; then
              echo "- Pushed: \`${IMAGE}:${{ steps.version.outputs.version }}\`, \`-${{ steps.version.outputs.date }}\`, \`latest\`"
              echo "- Digest: \`${{ steps.push.outputs.digest }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
